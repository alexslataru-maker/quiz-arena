
<div class="game">

  <header class="top">

    <div class="logo">🧠 QUIZ ARENA</div>

    <div class="score-box">⭐ Puncte: <span id="score">0</span></div>

  </header>

  <div class="progress">

    <div id="progressBar"></div>

  </div>

  <div class="info">

    <span id="category">CULTURĂ GENERALĂ</span>

    <span>Întrebarea <b id="level">1</b>/15</span>

  </div>

  <main id="playArea">

    <h1 id="question">Se pregătește jocul...</h1>

    <div id="answers"></div>

    <p id="feedback" aria-live="polite"></p>

    <button id="next" hidden>URMĂTOAREA ÎNTREBARE ➜</button>

  </main>
  
  <section id="final" hidden>

    <div class="trophy">🏆</div>

    <h2>Rundă terminată!</h2>

    <p id="finalScore"></p>

    <button id="restart">URMĂTORUL NIVEL ➜</button>

  </section>

  <footer>

    <p>💡 Învață. Joacă. Bate-ți recordul!</p>

    <p id="record">Record personal: 0 puncte</p>

    <button id="newGame" class="secondary">Începe o rundă nouă</button>

  </footer>

</div>
<script src="script.js"></script>

</body>

</html>
